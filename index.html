<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sirivan QR Scan</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e2e4e9;
    --text: #1a1a1a;
    --text-muted: #6b7280;
    --accent: #2563eb;      /* blue -- scan frame, PARTIAL button */
    --done: #16a34a;        /* green -- DONE button */
    --done-dark: #15803d;
    --accent-dark: #1d4ed8;
    --error: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    padding: 16px;
    font-size: 19px;
    font-weight: 700;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  main {
    flex: 1;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .step {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
  }
  .step-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .step-number {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    font-size: 12px;
    font-weight: 700;
  }

  /* Step 1: camera */
  #camWrap {
    position: relative;
    width: 100%;
    height: 220px;
    background: #d1d5db;
    border-radius: 10px;
    overflow: hidden;
  }
  video { width: 100%; height: 100%; object-fit: cover; }
  #scanBox {
    position: absolute;
    top: 50%; left: 50%;
    width: 65%; aspect-ratio: 1/1;
    transform: translate(-50%, -50%);
    border: 3px solid var(--accent);
    border-radius: 12px;
    box-shadow: 0 0 0 1000px rgba(0,0,0,0.15);
  }
  #qrValue {
    margin-top: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    word-break: break-all;
    min-height: 20px;
    color: var(--text-muted);
  }
  #qrValue.filled { color: var(--text); font-weight: 600; }
  #rescanBtn {
    margin-top: 10px;
    width: 100%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }

  /* Step 2: input */
  input[type="number"] {
    width: 100%;
    padding: 14px;
    font-size: 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }

  /* Step 3: actions */
  .btnRow { display: flex; gap: 10px; }
  button.action {
    flex: 1;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    color: white;
  }
  #btnDone { background: var(--done); }
  #btnDone:active { background: var(--done-dark); }
  #btnPartial { background: var(--accent); }
  #btnPartial:active { background: var(--accent-dark); }
  button.action:disabled {
    background: #d1d5db;
    color: #9ca3af;
    cursor: not-allowed;
  }

  #status {
    font-size: 14px;
    font-weight: 600;
    min-height: 20px;
    text-align: center;
  }
  #status.ok { color: var(--done); }
  #status.err { color: var(--error); }

  details {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
  }
  summary {
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
  }
  #log {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-muted);
    white-space: pre-wrap;
    word-break: break-all;
  }
</style>
</head>
<body>

<header>Workshop QR Scan</header>

<main>

  <div class="step">
    <div class="step-title"><span class="step-number">1</span> Scan the ticket QR code</div>
    <div id="camWrap">
      <video id="video" playsinline muted autoplay></video>
      <div id="scanBox"></div>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>
    <div id="qrValue">No code scanned yet</div>
    <button id="rescanBtn">Rescan</button>
  </div>

  <div class="step">
    <div class="step-title"><span class="step-number">2</span> Enter the quantity</div>
    <input type="number" id="valueInput" inputmode="numeric" pattern="[0-9]*" step="1" min="0" placeholder="0">
  </div>

  <div class="step">
    <div class="step-title"><span class="step-number">3</span> Choose an action</div>
    <div class="btnRow">
      <button class="action" id="btnDone" disabled>DONE</button>
      <button class="action" id="btnPartial" disabled>PARTIAL</button>
    </div>
  </div>

  <div id="status"></div>

  <details>
    <summary>Technical log</summary>
    <div id="log">--</div>
  </details>

</main>

<script>
// ============================================================
// CONFIG
// ============================================================
// Relay URL (runs on pavillon1). The browser never knows the Storga
// login/password -- only the relay does.
const RELAY_URL = "http://192.168.0.111:5000/relay/action";

// ============================================================
// Elements
// ============================================================
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const qrValueEl = document.getElementById('qrValue');
const statusEl = document.getElementById('status');
const valueInput = document.getElementById('valueInput');
const rescanBtn = document.getElementById('rescanBtn');
const logEl = document.getElementById('log');
const btnDone = document.getElementById('btnDone');
const btnPartial = document.getElementById('btnPartial');

let currentCode = null;
let stream = null;
let scanning = true;
let useBarcodeDetector = 'BarcodeDetector' in window;
let detector = null;
let jsQRLoaded = false;

// ============================================================
// Camera startup
// ============================================================
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });
    video.srcObject = stream;
    await video.play();
    scanning = true;
    setStatus("Camera active -- point at the QR code", "");

    if (useBarcodeDetector) {
      detector = new BarcodeDetector({ formats: ['qr_code'] });
      scanLoopNative();
    } else {
      await loadJsQR();
      scanLoopFallback();
    }
  } catch (e) {
    setStatus("Camera error: " + e.message, "err");
  }
}

function loadJsQR() {
  if (jsQRLoaded) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
    s.onload = () => { jsQRLoaded = true; resolve(); };
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

// ============================================================
// Scan loop -- native API (Chrome Android)
// ============================================================
async function scanLoopNative() {
  if (!scanning) return;
  try {
    const codes = await detector.detect(video);
    if (codes.length > 0) {
      onCodeDetected(codes[0].rawValue);
      return;
    }
  } catch (e) {
    // ignore, keep looping
  }
  requestAnimationFrame(scanLoopNative);
}

// ============================================================
// Scan loop -- jsQR fallback
// ============================================================
function scanLoopFallback() {
  if (!scanning) return;
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = window.jsQR(imageData.data, imageData.width, imageData.height);
    if (code) {
      onCodeDetected(code.data);
      return;
    }
  }
  requestAnimationFrame(scanLoopFallback);
}

function onCodeDetected(value) {
  currentCode = value;
  qrValueEl.textContent = value;
  qrValueEl.classList.add('filled');
  scanning = false;
  setStatus("Code read \u2714", "ok");
  if (navigator.vibrate) navigator.vibrate(80);
}

rescanBtn.addEventListener('click', () => {
  currentCode = null;
  qrValueEl.textContent = "No code scanned yet";
  qrValueEl.classList.remove('filled');
  setStatus("Camera active -- point at the QR code", "");
  scanning = true;
  if (useBarcodeDetector) scanLoopNative();
  else scanLoopFallback();
});

// ============================================================
// Value input -- enable/disable buttons
// ============================================================
function updateButtonsState() {
  const raw = valueInput.value.trim();
  const isValidInteger = raw.length > 0 && Number.isInteger(Number(raw));
  btnDone.disabled = !isValidInteger;
  btnPartial.disabled = !isValidInteger;
}
valueInput.addEventListener('input', updateButtonsState);

// ============================================================
// Buttons -- call the relay (which itself calls Storga)
// ============================================================
async function triggerAction(action) {
  const payload = {
    qr_code: currentCode || "",
    value: valueInput.value || "",
    action: action
  };

  logEl.textContent = "Sending to relay:\n" + JSON.stringify(payload, null, 2);
  setStatus("Sending...", "");
  btnDone.disabled = true;
  btnPartial.disabled = true;

  try {
    const res = await fetch(RELAY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(() => ({}));

    if (res.ok && data.success) {
      setStatus("\"" + action + "\" recorded \u2714", "ok");
      logEl.textContent += "\n\nSuccess -- Storga HTTP " + data.status;
    } else {
      setStatus("Failed -- " + (data.error || ("HTTP " + res.status)), "err");
      logEl.textContent += "\n\nFailed: " + JSON.stringify(data);
    }
  } catch (e) {
    setStatus("Network error to relay: " + e.message, "err");
    logEl.textContent += "\n\nNetwork error: " + e.message;
  } finally {
    updateButtonsState();
  }
}

btnDone.addEventListener('click', () => triggerAction('STOP'));
btnPartial.addEventListener('click', () => triggerAction('PARTIAL'));

function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = cls || "";
}

// ============================================================
// Init
// ============================================================
startCamera();
</script>
</body>
</html>
