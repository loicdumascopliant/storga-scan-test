<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Scan</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e2e4e9;
    --text: #1a1a1a;
    --text-muted: #6b7280;
    --accent: #2563eb;      /* blue -- scan frame, PARTIAL button */
    --done: #16a34a;        /* green -- DONE button */
    --done-dark: #15803d;
    --accent-dark: #1d4ed8;
    --error: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    padding: 16px;
    font-size: 19px;
    font-weight: 700;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  main {
    flex: 1;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .step {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
  }
  .step-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .step-number {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .icon { flex-shrink: 0; }

  /* Step 1: camera */
  #camWrap {
    position: relative;
    width: 100%;
    height: 220px;
    background: #d1d5db;
    border-radius: 10px;
    overflow: hidden;
  }
  video { width: 100%; height: 100%; object-fit: cover; }
  #scanBox {
    position: absolute;
    top: 50%; left: 50%;
    width: 65%; aspect-ratio: 1/1;
    transform: translate(-50%, -50%);
    border: 3px solid var(--accent);
    border-radius: 12px;
    box-shadow: 0 0 0 1000px rgba(0,0,0,0.15);
  }
  #qrValue {
    margin-top: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    word-break: break-all;
    min-height: 20px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #qrValue.filled { color: var(--text); font-weight: 600; }
  #qrValueText { flex: 1; }
  #rescanBtn {
    margin-top: 10px;
    width: 100%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 12px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  /* Step 2: input */
  input[type="number"] {
    width: 100%;
    padding: 16px;
    font-size: 24px;
    font-weight: 700;
    text-align: center;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }

  /* Step 3: actions */
  .btnRow { display: flex; gap: 10px; }
  button.action {
    flex: 1;
    padding: 20px 8px;
    font-size: 17px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  #btnDone { background: var(--done); }
  #btnDone:active { background: var(--done-dark); }
  #btnPartial { background: var(--accent); }
  #btnPartial:active { background: var(--accent-dark); }
  button.action:disabled {
    background: #d1d5db;
    color: #9ca3af;
    cursor: not-allowed;
  }

  #status {
    font-size: 15px;
    font-weight: 600;
    min-height: 22px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  #status.ok { color: var(--done); }
  #status.err { color: var(--error); }

  details {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
  }
  summary {
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
  }
  #log {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-muted);
    white-space: pre-wrap;
    word-break: break-all;
  }
</style>
</head>
<body>

<header>
  <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><line x1="14" y1="14" x2="21" y2="14"></line><line x1="14" y1="21" x2="21" y2="21"></line><line x1="17.5" y1="14" x2="17.5" y2="21"></line></svg>
  Workshop QR Scan
</header>

<main>

  <div class="step">
    <div class="step-title">
      <span class="step-number">1</span>
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
      Scan QR code
    </div>
    <div id="camWrap">
      <video id="video" playsinline muted autoplay></video>
      <div id="scanBox"></div>
    </div>
    <div id="qrValue">
      <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      <span id="qrValueText">No code scanned yet</span>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>
    <button id="rescanBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
      Rescan
    </button>
  </div>

  <div class="step">
    <div class="step-title">
      <span class="step-number">2</span>
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="6" y1="9" x2="6" y2="9"></line><line x1="10" y1="9" x2="10" y2="9"></line><line x1="14" y1="9" x2="14" y2="9"></line><line x1="18" y1="9" x2="18" y2="9"></line><line x1="6" y1="13" x2="18" y2="13"></line></svg>
      Enter quantity
    </div>
    <input type="number" id="valueInput" inputmode="numeric" pattern="[0-9]*" step="1" min="0" placeholder="0">
  </div>

  <div class="step">
    <div class="step-title">
      <span class="step-number">3</span>
      Confirm
    </div>
    <div class="btnRow">
      <button class="action" id="btnDone" disabled>
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        DONE
      </button>
      <button class="action" id="btnPartial" disabled>
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2 A10 10 0 0 1 12 22 Z" fill="white" stroke="none"></path></svg>
        PARTIAL
      </button>
    </div>
  </div>

  <div id="status"></div>

  <details>
    <summary>Technical log</summary>
    <div id="log">--</div>
  </details>

</main>

<script>
// ============================================================
// CONFIG
// ============================================================
// Relay URL (runs on pavillon1). The browser never knows the Storga
// login/password -- only the relay does.
const RELAY_URL = "http://192.168.0.111:5000/relay/action";

// ============================================================
// Elements
// ============================================================
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const qrValueEl = document.getElementById('qrValue');
const qrValueTextEl = document.getElementById('qrValueText');
const statusEl = document.getElementById('status');
const valueInput = document.getElementById('valueInput');
const rescanBtn = document.getElementById('rescanBtn');
const logEl = document.getElementById('log');
const btnDone = document.getElementById('btnDone');
const btnPartial = document.getElementById('btnPartial');

let currentCode = null;
let stream = null;
let scanning = true;
let useBarcodeDetector = 'BarcodeDetector' in window;
let detector = null;
let jsQRLoaded = false;

// ============================================================
// Camera startup
// ============================================================
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });
    video.srcObject = stream;
    await video.play();
    scanning = true;
    setStatus("Camera active", "");

    if (useBarcodeDetector) {
      detector = new BarcodeDetector({ formats: ['qr_code'] });
      scanLoopNative();
    } else {
      await loadJsQR();
      scanLoopFallback();
    }
  } catch (e) {
    setStatus("Camera error: " + e.message, "err");
  }
}

function loadJsQR() {
  if (jsQRLoaded) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
    s.onload = () => { jsQRLoaded = true; resolve(); };
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

// ============================================================
// Scan loop -- native API (Chrome Android)
// ============================================================
async function scanLoopNative() {
  if (!scanning) return;
  try {
    const codes = await detector.detect(video);
    if (codes.length > 0) {
      onCodeDetected(codes[0].rawValue);
      return;
    }
  } catch (e) {
    // ignore, keep looping
  }
  requestAnimationFrame(scanLoopNative);
}

// ============================================================
// Scan loop -- jsQR fallback
// ============================================================
function scanLoopFallback() {
  if (!scanning) return;
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = window.jsQR(imageData.data, imageData.width, imageData.height);
    if (code) {
      onCodeDetected(code.data);
      return;
    }
  }
  requestAnimationFrame(scanLoopFallback);
}

function onCodeDetected(value) {
  currentCode = value;
  qrValueTextEl.textContent = value;
  qrValueEl.classList.add('filled');
  scanning = false;
  setStatus("Code read", "ok");
  if (navigator.vibrate) navigator.vibrate(80);
}

rescanBtn.addEventListener('click', () => {
  currentCode = null;
  qrValueTextEl.textContent = "No code scanned yet";
  qrValueEl.classList.remove('filled');
  setStatus("Camera active", "");
  scanning = true;
  if (useBarcodeDetector) scanLoopNative();
  else scanLoopFallback();
});

// ============================================================
// Value input -- enable/disable buttons
// ============================================================
function updateButtonsState() {
  const raw = valueInput.value.trim();
  const isValidInteger = raw.length > 0 && Number.isInteger(Number(raw));
  btnDone.disabled = !isValidInteger;
  btnPartial.disabled = !isValidInteger;
}
valueInput.addEventListener('input', updateButtonsState);

// ============================================================
// Buttons -- call the relay (which itself calls Storga)
// ============================================================
async function triggerAction(action) {
  const payload = {
    qr_code: currentCode || "",
    value: valueInput.value || "",
    action: action
  };

  logEl.textContent = "Sending to relay:\n" + JSON.stringify(payload, null, 2);
  setStatus("Sending...", "");
  btnDone.disabled = true;
  btnPartial.disabled = true;

  try {
    const res = await fetch(RELAY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(() => ({}));

    if (res.ok && data.success) {
      setStatus(action + " recorded", "ok");
      logEl.textContent += "\n\nSuccess -- Storga HTTP " + data.status;
    } else {
      setStatus("Failed -- " + (data.error || ("HTTP " + res.status)), "err");
      logEl.textContent += "\n\nFailed: " + JSON.stringify(data);
    }
  } catch (e) {
    setStatus("Network error: " + e.message, "err");
    logEl.textContent += "\n\nNetwork error: " + e.message;
  } finally {
    updateButtonsState();
  }
}

btnDone.addEventListener('click', () => triggerAction('STOP'));
btnPartial.addEventListener('click', () => triggerAction('PARTIAL'));

function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = cls || "";
}

// ============================================================
// Init
// ============================================================
startCamera();
</script>
</body>
</html>
